    <button class="sh-toggle" type="button" aria-controls="siteNav" aria-expanded="false" aria-label="Menú">

</header>

<script>
(function () {
  var header = document.getElementById("siteHeader");
  var toggle = header.querySelector(".sh-toggle");
  toggle.addEventListener("click", function () {
    var open = header.classList.toggle("open");
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
  });
  // Mark the current page in the menu.
  var page = (location.pathname.split("/").pop() || "index.html").toLowerCase();
  header.querySelectorAll(".sh-nav a").forEach(function (a) {
    if (a.getAttribute("href").toLowerCase() === page) a.setAttribute("aria-current", "page");
  });
  // Language switch: shown only on pages that exist in both languages.
  var LANG_PAIRS = {"index.html": "../index.html", "portfolio.html": "../portfolio.html", "papers.html": "../Papers.html", "about.html": "../About.html"};
  var sw = document.getElementById("langSwitch");
  var pair = LANG_PAIRS[page];
  if (sw && pair) { sw.href = pair; sw.hidden = false; }
  // R Markdown wraps content in Bootstrap's container; the site layout handles width instead.
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".main-container").forEach(function (el) {
      el.classList.remove("main-container", "container-fluid");
      el.classList.add("footerPushDown");
    });
  });
})();
</script>
